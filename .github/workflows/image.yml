# Builds the app image for install.sh and pushes it to GitHub's container registry:
# ghcr.io/magnusfroste/vllm-cluster-spark:latest and :<APP_VERSION>.
# Easypanel installs build from the repo themselves and don't use this image.
name: image

on:
  push:
    branches: [main]
    paths: [app/**, agent/**, Dockerfile, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read APP_VERSION
        id: v
        run: echo "version=$(sed -n 's/^APP_VERSION = "\([^"]*\)".*/\1/p' app/main.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # DGX Spark is arm64; amd64 is for trying the app on an ordinary machine.
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
